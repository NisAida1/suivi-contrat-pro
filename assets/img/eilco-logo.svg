<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 140" role="img" aria-labelledby="eilco-title eilco-desc">
  <title id="eilco-title">EILCO - École d'Ingénieurs du Littoral Côte d'Opale</title>
  <desc id="eilco-desc">Logo de l'École d'Ingénieurs du Littoral Côte d'Opale</desc>
  
  <!-- Fond bleu marine comme dans l'image fournie -->
  <rect width="380" height="140" fill="#003d7a" rx="4"/>
  
  <!-- Bordure blanche du cadre -->
  <rect x="8" y="8" width="364" height="124" fill="none" stroke="#ffffff" stroke-width="3"/>
  
  <!-- Logo EIL en blanc/bleu clair -->
  <g fill="#ffffff">
    <!-- Lettre E -->
    <rect x="35" y="25" width="28" height="6" rx="1"/>
    <rect x="35" y="25" width="6" height="50" rx="1"/>
    <rect x="35" y="48" width="22" height="6" rx="1"/>
    <rect x="35" y="69" width="28" height="6" rx="1"/>
    
    <!-- Lettre I avec point -->
    <circle cx="85" cy="22" r="4"/>
    <rect x="82" y="30" width="6" height="45" rx="1"/>
    
    <!-- Lettre L -->
    <rect x="105" y="25" width="6" height="50" rx="1"/>
    <rect x="105" y="69" width="28" height="6" rx="1"/>
  </g>
  
  <!-- Texte "Cote d'Opale" en bleu clair -->
  <g fill="#5eb3e4" font-family="Arial, Helvetica, sans-serif" font-weight="400">
    <text x="150" y="50" font-size="20">Cote</text>
    <text x="150" y="72" font-size="20">d'Opale</text>
  </g>
  
  <!-- Ligne de séparation -->
  <rect x="20" y="90" width="340" height="2" fill="#5eb3e4"/>
  
  <!-- Texte "ÉCOLE D'INGÉNIEURS DU LITTORAL" -->
  <text x="30" y="110" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="0.5">ÉCOLE D'INGÉNIEURS DU LITTORAL</text>
</svg>
